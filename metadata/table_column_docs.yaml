tables:
- dataset: base
  system_name: Base Entities
  table: branches
  table_description: "Physical branch locations the NBFC operates from \u2014 the\
    \ geographic anchor for employees, loans, and campaigns."
  columns:
  - column: branch_id
    description: "Primary key \u2014 uniquely identifies each row in this table."
  - column: branch_name
    description: Display name of the branch, typically the city it's located in plus
      'Branch'.
  - column: region
    description: 'Broad geographic region (North/South/East/West/Central) the record
      is associated with. One of: North, South, East, West, Central.'
  - column: state
    description: 'Indian state associated with the record. One of: Rajasthan, Maharashtra,
      Delhi, Karnataka, Gujarat, Tamil Nadu, Uttar Pradesh, West Bengal.'
- dataset: base
  system_name: Base Entities
  table: employees
  table_description: All staff across every role (loan officers, collections agents,
    branch managers, sales reps, KYC officers), each attached to a home branch.
  columns:
  - column: employee_id
    description: "Primary key \u2014 uniquely identifies each row in this table."
  - column: name
    description: Full name of the person this record represents.
  - column: role
    description: "Job function \u2014 loan_officer, collections_agent, branch_manager,\
      \ sales_rep, or kyc_officer. One of: loan_officer, collections_agent, branch_manager,\
      \ sales_rep, kyc_officer."
  - column: branch_id
    description: "Foreign key to `branches` \u2014 the branch this record is associated\
      \ with. Foreign key into `branches`."
  - column: joined_date
    description: Date the employee joined the NBFC. Date, ranging 2019-01-01 to 2026-06-01.
- dataset: base
  system_name: Base Entities
  table: customers
  table_description: "Master record for every borrower \u2014 one row per real person,\
    \ referenced by nearly every other table in the schema."
  columns:
  - column: customer_id
    description: "Primary key \u2014 uniquely identifies each row in this table."
  - column: name
    description: Full name of the person this record represents.
  - column: dob
    description: Customer's date of birth. Date, ranging 1960-01-01 to 2005-01-01.
  - column: pan_number
    description: "Permanent Account Number \u2014 India's tax ID, used as a unique\
      \ identity check."
  - column: phone
    description: Contact phone number, in local (non-formatted) digits.
  - column: city
    description: City associated with the record.
  - column: state
    description: 'Indian state associated with the record. One of: Rajasthan, Maharashtra,
      Delhi, Karnataka, Gujarat, Tamil Nadu, Uttar Pradesh, West Bengal.'
  - column: occupation
    description: "Customer's stated occupation category. One of: salaried, self_employed (also matches user inputs like 'self-employed' or 'self employed'), business_owner (also matches 'business owner'), farmer."
  - column: income_band
    description: 'Customer''s self-declared annual income bracket. One of: 0-3L, 3-6L,
      6-12L, 12L+.'
  - column: created_at
    description: Timestamp when this record was first created in the source system.
      Date, ranging 2020-01-01 to 2026-08-01.
- dataset: base
  system_name: Base Entities
  table: loan_products
  table_description: The catalog of loan types the NBFC offers (gold, personal, vehicle,
    business, microfinance) and their amount bands.
  columns:
  - column: product_id
    description: "Primary key \u2014 uniquely identifies each row in this table."
  - column: loan_type
    description: 'The kind of loan this product represents (gold, personal, vehicle,
      business, microfinance). One of: gold, personal, vehicle, business, microfinance.'
  - column: min_amount
    description: "Minimum loan amount allowed under this product. Numeric, uniformly\
      \ ranging 10000\u201320000."
  - column: max_amount
    description: "Maximum loan amount allowed under this product. Numeric, uniformly\
      \ ranging 500000\u20132000000."
- dataset: los
  system_name: LOS
  table: loan_applications
  table_description: "Every loan application submitted, whether it was later approved,\
    \ rejected, or is still pending \u2014 the entry point into the lending funnel."
  columns:
  - column: application_id
    description: "Primary key \u2014 uniquely identifies each row in this table."
  - column: customer_id
    description: "Foreign key to `customers` \u2014 the borrower this record belongs\
      \ to. Foreign key into `customers`."
  - column: product_id
    description: "Foreign key to `loan_products` \u2014 the loan product involved.\
      \ Foreign key into `loan_products`."
  - column: branch_id
    description: "Foreign key to `branches` \u2014 the branch this record is associated\
      \ with. Foreign key into `branches`."
  - column: requested_amount
    description: Amount the customer requested at time of application. Numeric, roughly
      centered around 250000 (stddev 90000), bounded [15000, -].
  - column: application_date
    description: Date the application was submitted. Date, ranging 2023-01-01 to 2026-08-01.
  - column: status
    description: "Current lifecycle status of this record \u2014 see the table's status\
      \ values for the specific set used here. One of: approved, rejected, pending."
  - column: rejection_reason
    description: 'Reason the application was rejected; null unless status is ''rejected''.
      One of: low_credit_score, income_mismatch, incomplete_kyc, high_existing_debt
      (null unless status != rejected).'
- dataset: los
  system_name: LOS
  table: kyc_documents
  table_description: Identity documents submitted per customer (PAN, Aadhaar, Passport,
    Voter ID) and their verification status.
  columns:
  - column: kyc_id
    description: "Primary key \u2014 uniquely identifies each row in this table."
  - column: customer_id
    description: "Foreign key to `customers` \u2014 the borrower this record belongs\
      \ to. Foreign key into `customers`."
  - column: doc_type
    description: 'Type of identity document submitted. One of: PAN, Aadhaar, Passport,
      Voter_ID.'
  - column: verification_status
    description: 'Whether the document has been verified, is pending, or was rejected.
      One of: verified, pending, rejected.'
  - column: verified_at
    description: Date the document verification was completed. Date, ranging 2020-01-01
      to 2026-08-01.
- dataset: los
  system_name: LOS
  table: customer_risk_scores
  table_description: Credit risk scoring snapshots per customer, used at underwriting
    time to inform the approval decision.
  columns:
  - column: score_id
    description: "Primary key \u2014 uniquely identifies each row in this table."
  - column: customer_id
    description: "Foreign key to `customers` \u2014 the borrower this record belongs\
      \ to. Foreign key into `customers`."
  - column: credit_score
    description: Numeric credit score at time of assessment (roughly 300-900 scale).
      Numeric, roughly centered around 680 (stddev 90), bounded [300, 900].
  - column: risk_category
    description: "Bucketed risk tier derived from the credit score \u2014 low, medium,\
      \ or high. One of: low, medium, high."
  - column: scored_at
    description: Date this risk score was calculated. Date, ranging 2023-01-01 to
      2026-08-01.
- dataset: lms
  system_name: LMS
  table: loans
  table_description: "Disbursed loans only \u2014 the subset of approved applications\
    \ that actually converted into live loan accounts."
  columns:
  - column: loan_id
    description: "Primary key \u2014 uniquely identifies each row in this table."
  - column: application_id
    description: "Foreign key to `loan_applications` \u2014 the originating application.\
      \ Foreign key into `loan_applications` (restricted to status=approved)."
  - column: customer_id
    description: "Foreign key to `customers` \u2014 the borrower this record belongs\
      \ to. Foreign key into `customers` \u2014 value is carried through from `loan_applications`\
      \ at generation time via `application_id`, not sampled independently, so it\
      \ always stays consistent with it."
  - column: product_id
    description: "Foreign key to `loan_products` \u2014 the loan product involved.\
      \ Foreign key into `loan_products` \u2014 value is carried through from `loan_applications`\
      \ at generation time via `application_id`, not sampled independently, so it\
      \ always stays consistent with it."
  - column: branch_id
    description: "Foreign key to `branches` \u2014 the branch this record is associated\
      \ with. Foreign key into `branches` \u2014 value is carried through from `loan_applications`\
      \ at generation time via `application_id`, not sampled independently, so it\
      \ always stays consistent with it."
  - column: disbursed_amount
    description: Actual principal amount disbursed to the customer. Numeric, roughly
      centered around 240000 (stddev 85000), bounded [15000, -].
  - column: interest_rate
    description: "Annual interest rate applied to this loan, in percent. Numeric,\
      \ uniformly ranging 8\u201324."
  - column: tenure_months
    description: 'Loan tenure in months, used to compute the amortization schedule.
      One of: 12, 24, 36, 48, 60.'
  - column: disbursement_date
    description: Date the loan amount was disbursed to the customer. Date, ranging
      2023-01-15 to 2026-07-01.
  - column: status
    description: "Current loan status \u2014 active, closed, npa (non-performing),\
      \ or written_off. One of: active, closed, npa, written_off."
- dataset: lms
  system_name: LMS
  table: emi_schedule
  table_description: "The full reducing-balance amortization schedule, one row per EMI installment per loan — the ground truth for what's owed and when."
  columns:
  - column: emi_id
    description: "Primary key — uniquely identifies each scheduled EMI installment row."
  - column: loan_id
    description: "Foreign key to loans table — identifies the loan this installment belongs to."
  - column: installment_no
    description: "Sequence number of the installment (1, 2, 3, ... up to tenure_months)."
  - column: due_date
    description: "Due date on which this EMI installment is scheduled to be paid."
  - column: emi_amount
    description: "Total EMI amount due for this installment (principal + interest)."
  - column: principal_component
    description: "Principal portion of the total EMI installment amount."
  - column: interest_component
    description: "Interest portion of the total EMI installment amount."
  - column: outstanding_after
    description: "Remaining principal balance outstanding on the loan after this installment."
- dataset: lms
  system_name: LMS
  table: payments
  table_description: "EMIs that have actually been paid, with realistic on-time/late/missed timing derived from each loan's status."
  columns:
  - column: payment_id
    description: "Primary key — uniquely identifies each actual payment collection event."
  - column: emi_id
    description: "Foreign key to emi_schedule table — identifies the scheduled EMI installment paid."
  - column: loan_id
    description: "Foreign key to loans table — identifies the loan this payment belongs to."
  - column: amount_paid
    description: "Actual monetary amount paid/collected for this EMI installment. Use for all actual collected EMI payment, revenue, and recovery queries (do NOT compute manual math on disbursement_date when actual payment records exist)."
  - column: payment_date
    description: "Date on which the payment was actually collected/processed."
  - column: payment_mode
    description: "Payment channel/mode used by customer (e.g., nach, upi, netbanking, cheque, cash)."
- dataset: lms
  system_name: LMS
  table: overdue_accounts
  table_description: One row per loan currently overdue, aggregating unpaid EMIs past
    their due date into a days-past-due (DPD) bucket.
  columns:
  - column: loan_id
    description: "Primary/Foreign key \u2014 uniquely identifies loan in overdue status."
  - column: days_past_due
    description: Number of days past due (DPD) payment.
  - column: overdue_amount
    description: Total principal and interest overdue amount outstanding.
  - column: dpd_bucket
    description: DPD bucket category (0-30, 31-60, 61-90, 90+).
- dataset: lms
  system_name: LMS
  table: collections_activity
  table_description: "Recovery actions taken against overdue loans \u2014 calls, field\
    \ visits, legal notices \u2014 and their outcomes."
  columns:
  - column: activity_id
    description: Unique identifier (primary key) for this row.
  - column: loan_id
    description: "Foreign key to `loans` \u2014 the disbursed loan this record relates\
      \ to. Foreign key into `overdue_accounts`."
  - column: employee_id
    description: "Foreign key to `employees` \u2014 the staff member associated with\
      \ this record. Foreign key into `employees` (restricted to role=collections_agent)."
  - column: activity_type
    description: "Type of recovery action taken \u2014 call, field visit, legal notice,\
      \ or SMS reminder. One of: call, field_visit, legal_notice, sms_reminder."
  - column: activity_date
    description: Date the collections activity took place. Date, ranging 2024-01-01
      to 2026-08-01.
  - column: outcome
    description: "Result of the collections activity \u2014 promised to pay, no response,\
      \ paid, or disputed. One of: promised_to_pay, no_response, paid, disputed."
- dataset: incentive
  system_name: Incentive Engine
  table: incentive_payouts
  table_description: Monthly incentive/bonus payouts to loan officers, tied to loan
    sourcing, collections, cross-sell, or retention performance.
  columns:
  - column: incentive_id
    description: "Primary key \u2014 uniquely identifies each row in this table."
  - column: employee_id
    description: "Foreign key to `employees` \u2014 the staff member associated with\
      \ this record. Foreign key into `employees` (restricted to role=loan_officer)."
  - column: loan_id
    description: "Foreign key to `loans` \u2014 the disbursed loan this record relates\
      \ to. Foreign key into `loans`."
  - column: incentive_type
    description: "Category of incentive being paid \u2014 loan sourcing, collections\
      \ bonus, cross-sell, or retention. One of: loan_sourcing, collections_bonus,\
      \ cross_sell, retention."
  - column: period_month
    description: The month this incentive payout covers. Date, ranging 2024-01-01
      to 2026-07-01.
  - column: base_amount
    description: Fixed base incentive amount before bonuses or deductions. Numeric,
      roughly centered around 8000 (stddev 2500), bounded [500, -].
  - column: bonus_amount
    description: "Variable bonus added on top of the base incentive. Numeric, uniformly\
      \ ranging 0\u20136000."
  - column: deduction_amount
    description: "Amount deducted from the incentive, e.g. for policy violations or\
      \ clawbacks. Numeric, uniformly ranging 0\u20131500."
  - column: payout_status
    description: 'Whether the incentive has been paid, is pending, or is on hold.
      One of: paid, pending, hold.'
  - column: payout_date
    description: Date the incentive was (or is scheduled to be) paid out. Date, ranging
      2024-01-05 to 2026-08-01.
- dataset: zoho
  system_name: Zoho People
  table: zoho_employee_records
  table_description: "HR master data synced from Zoho People \u2014 designation, department,\
    \ joining date, and performance rating per employee."
  columns:
  - column: zoho_record_id
    description: "Primary key \u2014 uniquely identifies each row in this table."
  - column: employee_id
    description: "Foreign key to `employees` \u2014 the staff member associated with\
      \ this record. Foreign key into `employees`."
  - column: designation
    description: 'Job title/level in the HR system, distinct from the operational
      `role` field in `employees`. One of: associate, senior_associate, team_lead,
      assistant_manager, manager.'
  - column: department
    description: 'HR department the employee is assigned to. One of: sales, collections,
      operations, credit, hr.'
  - column: date_of_joining
    description: Joining date as recorded in Zoho (should align with `employees.joined_date`).
      Date, ranging 2019-01-01 to 2026-06-01.
  - column: employment_type
    description: 'Full-time, contract, or intern. One of: full_time, contract, intern.'
  - column: reporting_manager
    description: Name of the employee's manager, as recorded in Zoho.
  - column: work_location
    description: City the employee is based out of for HR purposes.
  - column: leave_balance_days
    description: "Number of paid leave days remaining for the employee. Numeric, uniformly\
      \ ranging 0\u201330."
  - column: performance_rating
    description: 'Latest performance rating on a 1-5 scale (stored as text). One of:
      1, 2, 3, 4, 5.'
- dataset: crm
  system_name: CRM
  table: campaigns
  table_description: "Marketing campaigns run to generate loan leads \u2014 budget,\
    \ channel, targeting, and performance-to-target at the campaign level."
  columns:
  - column: campaign_id
    description: "Primary key \u2014 uniquely identifies each row in this table."
  - column: campaign_name
    description: 'Human-readable name of the marketing campaign. One of: Diwali Gold
      Loan Push, Monsoon Personal Loan, Vehicle Loan Blitz, SME Growth Drive, Digital
      First-Time Borrower, Referral Rewards, New Year Cashback, Farm Credit Outreach.'
  - column: channel
    description: "Primary channel the campaign runs through \u2014 digital, referral,\
      \ branch walk-in, or telecalling. One of: digital, referral, branch_walkin,\
      \ telecalling."
  - column: campaign_type
    description: "Strategic purpose of the campaign \u2014 awareness, acquisition,\
      \ retention, or cross-sell. One of: awareness, acquisition, retention, cross_sell."
  - column: product_id
    description: "Foreign key to `loan_products` — loan product category promoted by this campaign. (Note: To query acquired customers or leads for a specific campaign, join `leads` on campaign_id, NOT product_id alone)."
  - column: target_region
    description: 'Region the campaign is targeted at. One of: North, South, East,
      West, Central.'
  - column: target_state
    description: 'State the campaign is targeted at. One of: Rajasthan, Maharashtra,
      Delhi, Karnataka, Gujarat, Tamil Nadu, Uttar Pradesh, West Bengal.'
  - column: start_date
    description: Date the campaign begins. Date, ranging 2023-01-01 to 2026-06-01.
  - column: end_date
    description: Date the campaign ends (or is scheduled to end). Date, ranging 2023-02-01
      to 2026-08-01.
  - column: budget_allocated
    description: Total budget approved for the campaign. Numeric, roughly centered
      around 500000 (stddev 150000), bounded [20000, -].
  - column: budget_spent
    description: Actual spend to date against the allocated budget. Numeric, roughly
      centered around 420000 (stddev 140000), bounded [0, -].
  - column: leads_target
    description: "Number of leads the campaign is targeted to generate. Numeric, uniformly\
      \ ranging 200\u20135000."
  - column: impressions
    description: "Total ad/content impressions generated by the campaign. Numeric,\
      \ uniformly ranging 10000\u20132000000."
  - column: clicks
    description: "Total clicks generated by the campaign. Numeric, uniformly ranging\
      \ 500\u2013100000."
  - column: conversion_rate_target
    description: "Target conversion rate (%) the campaign is expected to hit. Numeric,\
      \ uniformly ranging 1\u201315."
  - column: cost_per_lead
    description: Average cost incurred per lead generated. Numeric, roughly centered
      around 150 (stddev 60), bounded [10, -].
  - column: campaign_manager_id
    description: "Foreign key to `employees` (sales_rep) \u2014 the person managing\
      \ this campaign. Foreign key into `employees` (restricted to role=sales_rep)."
  - column: status
    description: "Current lifecycle status of this record \u2014 see the table's status\
      \ values for the specific set used here. One of: active, completed, paused."
  - column: priority
    description: 'Relative priority/urgency assigned to this record. One of: high,
      medium, low.'
  - column: created_at
    description: Timestamp when this record was first created in the source system.
      Date, ranging 2023-01-01 to 2026-06-01.
- dataset: crm
  system_name: CRM
  table: leads
  table_description: Prospective customers captured through a campaign or other channel,
    before (or instead of) converting into an actual borrower.
  columns:
  - column: lead_id
    description: "Primary key \u2014 uniquely identifies each row in this table."
  - column: campaign_id
    description: "Foreign key to `campaigns` \u2014 the marketing campaign this record\
      \ is tied to. Foreign key into `campaigns`."
  - column: lead_name
    description: Name of the prospective customer.
  - column: phone
    description: Contact phone number, in local (non-formatted) digits.
  - column: city
    description: City associated with the record.
  - column: state
    description: 'Indian state associated with the record. One of: Rajasthan, Maharashtra,
      Delhi, Karnataka, Gujarat, Tamil Nadu, Uttar Pradesh, West Bengal.'
  - column: source_channel
    description: "Channel the lead originated from \u2014 digital, referral, branch\
      \ walk-in, or telecalling. One of: digital, referral, branch_walkin, telecalling."
  - column: product_id
    description: "Foreign key to `loan_products` \u2014 the loan product involved.\
      \ Foreign key into `loan_products`."
  - column: requested_amount_interest
    description: Approximate loan amount the lead has expressed interest in. Numeric,
      roughly centered around 220000 (stddev 90000), bounded [10000, -].
  - column: lead_score
    description: "Numeric score (0-100) indicating how promising this lead is, used\
      \ for prioritization. Numeric, uniformly ranging 0\u2013100."
  - column: status
    description: "Current lifecycle status of this record \u2014 see the table's status\
      \ values for the specific set used here. One of: new, contacted, qualified,\
      \ converted, dropped."
  - column: assigned_employee_id
    description: "Foreign key to `employees` (sales_rep) \u2014 who is working this\
      \ lead. Foreign key into `employees` (restricted to role=sales_rep)."
  - column: created_at
    description: Timestamp when this record was first created in the source system.
      Date, ranging 2023-01-01 to 2026-08-01.
  - column: last_contacted_at
    description: Date of the most recent contact attempt with this lead. Date, ranging
      2023-01-02 to 2026-08-01.
  - column: follow_up_count
    description: "Number of follow-up attempts made with this lead so far. Numeric,\
      \ uniformly ranging 0\u201312."
  - column: conversion_probability
    description: "Modeled probability (0-1) that this lead converts into a customer.\
      \ Numeric, uniformly ranging 0\u20131."
  - column: age_band
    description: 'Age bracket of the lead. One of: 18-25, 26-35, 36-45, 46-60, 60+.'
  - column: occupation
    description: 'Lead''s stated occupation category. One of: salaried, self_employed,
      business_owner, farmer.'
  - column: income_band
    description: 'Lead''s self-declared income bracket. One of: 0-3L, 3-6L, 6-12L,
      12L+.'
  - column: is_existing_customer
    description: 'Whether this ''lead'' is actually an existing customer being cross-sold
      to. One of: yes, no.'
- dataset: crm
  system_name: CRM
  table: lead_activities
  table_description: Every individual touchpoint (call, SMS, email, branch visit)
    a sales rep has with a lead, and its outcome.
  columns:
  - column: activity_id
    description: "Primary key \u2014 uniquely identifies each row in this table."
  - column: lead_id
    description: "Foreign key to `leads` \u2014 the prospective customer this record\
      \ relates to. Foreign key into `leads`."
  - column: employee_id
    description: "Foreign key to `employees` \u2014 the staff member associated with\
      \ this record. Foreign key into `employees` (restricted to role=sales_rep)."
  - column: activity_type
    description: "Type of touchpoint \u2014 call, SMS, email, WhatsApp, or branch\
      \ visit. One of: call, sms, email, whatsapp, branch_visit."
  - column: activity_date
    description: Date the activity took place. Date, ranging 2023-01-01 to 2026-08-01.
  - column: outcome
    description: "Result of the activity \u2014 interested, not interested, callback\
      \ requested, no answer, or converted. One of: interested, not_interested, callback_requested,\
      \ no_answer, converted."
  - column: duration_minutes
    description: "Length of the interaction, in minutes. Numeric, uniformly ranging\
      \ 1\u201345."
  - column: channel_cost
    description: Cost incurred to carry out this specific activity. Numeric, roughly
      centered around 20 (stddev 8), bounded [0, -].
  - column: sentiment_score
    description: "Sentiment of the interaction, from -1 (negative) to 1 (positive).\
      \ Numeric, uniformly ranging -1\u20131."
  - column: follow_up_scheduled
    description: 'Whether a follow-up has been scheduled as a result of this activity.
      One of: yes, no.'
  - column: priority
    description: 'Relative priority/urgency assigned to this record. One of: high,
      medium, low.'
  - column: region
    description: 'Broad geographic region (North/South/East/West/Central) the record
      is associated with. One of: North, South, East, West, Central.'
  - column: device_type
    description: 'Device the lead used, if the activity was digital. One of: mobile,
      desktop, tablet, in_person.'
  - column: agent_notes_flag
    description: 'Categorical value for agent notes flag. One of: yes, no.'
  - column: time_of_day
    description: 'Part of day the activity occurred. One of: morning, afternoon, evening,
      night.'
  - column: day_of_week_type
    description: 'Whether the activity happened on a weekday or weekend. One of: weekday,
      weekend.'
  - column: attempt_number
    description: "Which numbered contact attempt this is for this lead. Numeric, uniformly\
      \ ranging 1\u20138."
  - column: resulted_in_lead_status_change
    description: 'Whether this activity caused the lead''s status field to change.
      One of: yes, no.'
  - column: escalated
    description: 'Whether this activity was escalated to a supervisor. One of: yes,
      no.'
  - column: created_at
    description: Timestamp when this record was first created in the source system.
      Date, ranging 2023-01-01 to 2026-08-01.
- dataset: crm
  system_name: CRM
  table: campaign_responses
  table_description: Discrete response events to a campaign (a click, a form submit,
    a branch walk-in) tied back to both the campaign and the lead who responded.
  columns:
  - column: response_id
    description: "Primary key \u2014 uniquely identifies each row in this table."
  - column: campaign_id
    description: "Foreign key to `campaigns` \u2014 the marketing campaign this record\
      \ is tied to. Foreign key into `campaigns`."
  - column: lead_id
    description: "Foreign key to `leads` \u2014 the prospective customer this record\
      \ relates to. Foreign key into `leads`."
  - column: response_channel
    description: "How the lead responded \u2014 SMS link, email click, callback, form\
      \ submit, or branch visit. One of: sms_link, email_click, call_back, form_submit,\
      \ branch_visit."
  - column: response_date
    description: Date of the response event. Date, ranging 2023-01-01 to 2026-08-01.
  - column: engagement_score
    description: "Numeric measure (0-100) of how engaged the response was. Numeric,\
      \ uniformly ranging 0\u2013100."
  - column: clicked
    description: 'Whether the lead clicked through on the campaign content. One of:
      yes, no.'
  - column: converted
